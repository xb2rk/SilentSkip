<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craftland QA</title>
    <script>
      // Prevent a theme/density flash before React mounts: apply the persisted theme
      // (or the dark-first default) and density to <html> as the very first thing the
      // page runs. Keep the storage keys in sync with web/src/lib/theme.ts and
      // web/src/lib/density.ts.
      (() => {
        try {
          const stored = window.localStorage.getItem("craftland-qa:theme");
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          if (window.localStorage.getItem("craftland-qa:density") === "compact") {
            document.documentElement.dataset.density = "compact";
          }
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
